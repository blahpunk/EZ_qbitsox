<!-- templates/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Switcher</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
    <h1>Proxy Switcher</h1>

    <p>Current qBittorrent Proxy: <span id="current-proxy">{{ current_proxy }}</span></p>
    <p>Current Firefox Proxy: <span id="current-firefox-proxy">{{ firefox_proxy }}</span></p>
    <p>Status: <span id="update-status">Idle</span></p>
    <p>Last update: <span id="last-update"></span></p>

    <button onclick="updateProxies()">Update Proxies</button>

    <div class="table-container">
        <table id="proxy-table">
            <thead>
                <tr>
                    <th>Proxy</th>
                    <th>TCP</th>
                    <th>SOCKS5</th>
                    <th>Remote</th>
                    <th>DNS</th>
                    <th>HTTP (S5)</th>
                    <th>HTTPS (S5)</th>
                    <th>HTTP</th>
                    <th>HTTPS</th>
                    <th>Bandwidth (KB/s)</th>
                    <th>Tracker TCP</th>
                    <th>Tracker UDP</th>
                    <th>Last Checked</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- JS dynamically fills this -->
            </tbody>
        </table>
    </div>
</div>
<script src="/static/js/script.js"></script>
</body>
</html>
